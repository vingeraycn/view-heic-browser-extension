      let dynamicCount = 0
      let currentLang = getInitialLang()

      function getInitialLang() {
        const queryLang = new URLSearchParams(window.location.search).get('lang')
        if (queryLang === 'zh' || queryLang === 'en') return queryLang
        return navigator.languages?.some((lang) => lang.toLowerCase().startsWith('zh')) ? 'zh' : 'en'
      }

      function setText(selector, value) {
        document.querySelectorAll(selector).forEach((node) => {
          node.textContent = value
        })
      }

      function renderLanguage(lang, updateUrl = false) {
        currentLang = lang
        const t = messages[lang]
        document.documentElement.lang = t.lang
        document.title = t.title
        document.querySelector('meta[name="description"]').setAttribute('content', t.description)
        document.querySelector('meta[property="og:title"]').setAttribute('content', t.title)
        document.querySelector('meta[property="og:description"]').setAttribute('content', t.description)
        document.querySelector('meta[name="twitter:title"]').setAttribute('content', t.title)
        document.querySelector('meta[name="twitter:description"]').setAttribute('content', t.description)

        if (updateUrl) {
          const url = new URL(window.location.href)
          url.searchParams.set('lang', lang)
          window.history.replaceState(null, '', url)
        }

        document.querySelectorAll('[data-i18n]').forEach((node) => {
          const key = node.dataset.i18n
          if (typeof t[key] === 'string') node.textContent = t[key]
        })

        document.querySelectorAll('.lang-btn').forEach((button) => {
          const active = button.dataset.langOption === lang
          button.className = active
            ? 'lang-btn rounded-full bg-slate-950 px-3 py-1.5 text-white transition-colors'
            : 'lang-btn rounded-full px-3 py-1.5 text-slate-500 transition-colors hover:text-slate-900'
        })

        renderNav(t)
        renderTrust(t)
        renderStats(t)
        renderFeatures(t)
        renderSteps(t)
        renderFlow(t)
        renderDemo(t)
        renderInstall(t)
        renderTech(t)
        renderFaq(t)
        renderFooter(t)
        setText('#add-dynamic-btn', t.dynamicButton)
        setText('#ext-status-banner', t.detecting)
        updateBadges()
        updateStats()
      }

      function renderNav(t) {
        const nav = document.getElementById('nav-links')
        nav.innerHTML = t.nav.map(([id, label]) => `<a href="#${id}" class="transition hover:text-brand-700">${label}</a>`).join('')
      }

      function renderTrust(t) {
        document.getElementById('trust-strip').innerHTML = t.trust
          .map((item) => `<div class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold text-slate-700 shadow-sm">${item}</div>`)
          .join('')
      }

      function renderStats(t) {
        document.getElementById('stats').innerHTML = t.stats
          .map(([value, label]) => `<div><div class="text-3xl font-extrabold">${value}</div><div class="mt-1 text-sm font-medium text-slate-300">${label}</div></div>`)
          .join('')
      }

      function renderFeatures(t) {
        document.getElementById('features-grid').innerHTML = t.features
          .map(([title, body]) => `<article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><h3 class="text-lg font-extrabold text-slate-950">${title}</h3><p class="mt-3 text-sm leading-7 text-slate-600">${body}</p></article>`)
          .join('')
      }

      function renderSteps(t) {
        document.getElementById('steps').innerHTML = t.steps
          .map(([number, title, body]) => `<article class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-brand-600 text-base font-extrabold text-white">${number}</div><h3 class="mt-5 text-lg font-extrabold text-slate-950">${title}</h3><p class="mt-3 text-sm leading-7 text-slate-600">${body}</p></article>`)
          .join('')
      }

      function renderFlow(t) {
        document.getElementById('flow').innerHTML = t.flow
          .map((item, index) => `<span class="rounded-full ${index === t.flow.length - 1 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-700'} px-4 py-2 font-bold">${item}</span>${index === t.flow.length - 1 ? '' : '<span class="text-slate-300">→</span>'}`)
          .join('')
      }

      function renderDemo(t) {
        document.getElementById('demo-grid').innerHTML = t.demoCases
          .map(([file, title, size, tag]) => `<article class="heic-card overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm"><div class="relative flex h-44 items-center justify-center overflow-hidden bg-slate-100"><img src="./${file}" alt="${title}" class="h-full w-full object-cover" /><span class="status-badge bg-slate-100 text-slate-500">${t.waiting}</span></div><div class="p-4"><h3 class="font-extrabold text-slate-900">${title}</h3><p class="mt-1 text-sm text-slate-500">${file} · ${size}</p><span class="mt-3 inline-flex rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-brand-700">${tag}</span></div></article>`)
          .join('')

        document.getElementById('demo-stats').innerHTML = t.counters
          .map((label, index) => `<div class="rounded-2xl border border-slate-200 bg-white p-4 text-center shadow-sm"><div class="text-3xl font-extrabold ${index === 0 ? 'text-emerald-600' : index === 1 ? 'text-slate-500' : 'text-brand-600'}" id="${index === 0 ? 'success-count' : index === 1 ? 'failure-count' : 'total-count'}">0</div><div class="mt-1 text-xs font-bold text-slate-500">${label}</div></div>`)
          .join('')
      }

      function renderInstall(t) {
        document.getElementById('install-cards').innerHTML = t.installCards
          .map(([badge, title, steps, cta, href], index) => `<article class="rounded-3xl border ${index === 0 ? 'border-brand-200 bg-blue-50' : 'border-slate-200 bg-white'} p-7 shadow-sm"><span class="inline-flex rounded-full ${index === 0 ? 'bg-brand-600 text-white' : 'bg-slate-100 text-slate-600'} px-3 py-1 text-xs font-extrabold">${badge}</span><h3 class="mt-5 text-2xl font-extrabold text-slate-950">${title}</h3><ol class="mt-5 space-y-3 text-sm leading-6 text-slate-700">${steps.map((step, stepIndex) => `<li class="flex gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-950 text-xs font-extrabold text-white">${stepIndex + 1}</span><span>${step}</span></li>`).join('')}</ol><a href="${href}" ${href.startsWith('#') ? '' : 'target="_blank" rel="noopener"'} class="mt-7 inline-flex w-full justify-center rounded-full bg-slate-950 px-5 py-3 text-sm font-bold text-white transition hover:bg-slate-800">${cta}</a></article>`)
          .join('')
      }

      function renderTech(t) {
        document.getElementById('tech-grid').innerHTML = t.tech
          .map(([title, body]) => `<article class="rounded-3xl border border-slate-200 bg-slate-50 p-6 text-center"><h3 class="font-extrabold text-slate-950">${title}</h3><p class="mt-3 text-sm leading-6 text-slate-600">${body}</p></article>`)
          .join('')
      }

      function renderFaq(t) {
        document.getElementById('faq-list').innerHTML = t.faqs
          .map(([question, answer]) => `<details class="group rounded-2xl border border-slate-200 bg-white shadow-sm"><summary class="flex cursor-pointer list-none items-center justify-between gap-4 px-5 py-4 font-extrabold text-slate-900"><span>${question}</span><span class="text-slate-400 transition group-open:rotate-180">⌄</span></summary><p class="px-5 pb-5 text-sm leading-7 text-slate-600">${answer}</p></details>`)
          .join('')
      }

      function renderFooter(t) {
        document.getElementById('footer-links').innerHTML = [
          ['how-it-works', t.nav[0][1]],
          ['demo', t.nav[2][1]],
          ['install', t.installShort],
          ['faq', t.nav[3][1]],
        ].map(([id, label]) => `<li><a href="#${id}" class="transition hover:text-white">${label}</a></li>`).join('') +
          `<li><a href="./test-improved.html" class="transition hover:text-white">${t.devTest}</a></li>`

        document.getElementById('project-links').innerHTML = [
          [GITHUB_URL, 'GitHub'],
          [`${GITHUB_URL}/issues`, 'Issues'],
          [`${GITHUB_URL}/releases`, 'Releases'],
          [STORE_URL, 'Chrome Web Store'],
        ].map(([href, label]) => `<li><a href="${href}" target="_blank" rel="noopener" class="transition hover:text-white">${label}</a></li>`).join('')
      }

      function detectExtension() {
        const t = messages[currentLang]
        const banner = document.getElementById('ext-status-banner')
        setTimeout(() => {
          const active = document.querySelector('img.heic-converted, img.heic-processing') !== null
          if (active) {
            banner.className = 'mt-8 rounded-2xl border border-emerald-200 bg-emerald-50 p-4 text-center text-sm font-bold text-emerald-800'
            banner.textContent = t.detected
          } else {
            banner.className = 'mt-8 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-center text-sm font-bold text-amber-800'
            banner.textContent = ''
            const prefix = document.createTextNode(t.notDetectedPrefix)
            const link = document.createElement('a')
            link.href = STORE_URL
            link.target = '_blank'
            link.rel = 'noopener noreferrer'
            link.className = 'underline'
            link.textContent = t.notDetectedLink
            const suffix = document.createTextNode(t.notDetectedSuffix)
            banner.append(prefix, link, suffix)
          }
          updateBadges()
          updateStats()
        }, 2200)
      }

      function updateBadges() {
        const t = messages[currentLang]
        document.querySelectorAll('.heic-card').forEach((card) => {
          const img = card.querySelector('img')
          const badge = card.querySelector('.status-badge')
          if (!img || !badge) return
          if (img.classList.contains('heic-converted')) {
            badge.textContent = t.converted
            badge.className = 'status-badge bg-emerald-100 text-emerald-700'
          } else if (img.classList.contains('heic-processing')) {
            badge.textContent = t.processing
            badge.className = 'status-badge bg-amber-100 text-amber-800'
          } else {
            badge.textContent = t.waiting
            badge.className = 'status-badge bg-slate-100 text-slate-500'
          }
        })
      }

      function updateStats() {
        const all = document.querySelectorAll('.heic-card img')
        const ok = document.querySelectorAll('.heic-card img.heic-converted')
        const total = document.getElementById('total-count')
        const success = document.getElementById('success-count')
        const failure = document.getElementById('failure-count')
        if (total) total.textContent = all.length
        if (success) success.textContent = ok.length
        if (failure) failure.textContent = all.length - ok.length
        updateBadges()
      }

      function addDynamicImage() {
        dynamicCount += 1
        const t = messages[currentLang]
        const tc = t.demoCases[(dynamicCount - 1) % t.demoCases.length]
        const container = document.getElementById('dynamic-images')
        const card = document.createElement('div')
        card.className = 'heic-card overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm'
        card.innerHTML = `
          <div class="relative h-36 overflow-hidden bg-slate-100">
            <img src="./${tc[0]}" alt="${tc[1]} #${dynamicCount}" class="h-full w-full object-cover" />
            <span class="status-badge bg-slate-100 text-slate-500">${t.waiting}</span>
          </div>
          <div class="p-4">
            <p class="text-sm font-extrabold text-slate-800">#${dynamicCount} · ${tc[1]}</p>
            <p class="mt-1 text-xs text-slate-500">${tc[2]} · ${new Date().toLocaleTimeString()}</p>
          </div>`
        container.appendChild(card)
        setTimeout(updateStats, 1200)
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderLanguage(currentLang)
        document.querySelectorAll('.lang-btn').forEach((button) => {
          button.addEventListener('click', () => renderLanguage(button.dataset.langOption, true))
        })
        detectExtension()
        setInterval(updateStats, 2500)
      })
    </script>
  </body>
